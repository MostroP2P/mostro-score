schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Full SDD Cycle"
  version: "2.1.0"
  author: "GitHub"
  description: "Runs constitution -> specify -> clarify -> plan -> checklist -> tasks -> analyze -> implement -> converge with a review gate before every step, matching this repository's ratified constitution (Development Workflow section)."

requires:
  # 0.8.5 is the first release with engine-side resolution of the
  # ``integration: "auto"`` default. Older versions would treat "auto"
  # as a literal integration key and fail at dispatch.
  speckit_version: ">=0.8.5"
  integrations:
    # The commands below are core spec-kit commands provided by every
    # integration. The list here is an advisory, non-exhaustive compatibility
    # hint following the documented ``any: [...]`` schema -- it is NOT a
    # closed set. The workflow runs against any integration the project was
    # initialized with, including ones not listed below, as long as that
    # integration provides every command referenced in ``steps``.
    any:
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (e.g. claude, copilot, gemini; 'auto' uses the project's initialized integration)"

steps:
  - id: constitution
    command: speckit.constitution
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-constitution
    type: gate
    message: "Review the constitution (no-op if already ratified and unchanged) before specifying."
    options: [approve, reject]
    on_reject: abort

  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec before clarifying."
    options: [approve, reject]
    on_reject: abort

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-clarify
    type: gate
    message: "Review the clarifications before planning."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating the quality checklist."
    options: [approve, reject]
    on_reject: abort

  - id: checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-checklist
    type: gate
    message: "Review the quality checklist before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-tasks
    type: gate
    message: "Review the task list before cross-artifact analysis."
    options: [approve, reject]
    on_reject: abort

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-analyze
    type: gate
    message: "Review the analysis findings before implementation."
    options: [approve, reject]
    on_reject: abort

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-implement
    type: gate
    message: "Review the implementation before convergence."
    options: [approve, reject]
    on_reject: abort

  # NOTE: speckit.converge can append new tasks to tasks.md when it finds unfinished work
  # (outcome: tasks_appended). This schema does not support a conditional loop back to the
  # `implement` step above, so the review-converge gate below is the enforcement point: it
  # requires an explicit human confirmation that convergence was clean before the workflow is
  # considered complete. Rejecting means tasks were appended; manually repeat
  # implement -> review-implement -> converge until convergence reports a clean result.
  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-converge
    type: gate
    message: "Confirm /speckit-converge reported a clean result with NO tasks appended. If it appended any tasks, reject this gate and manually re-run implement -> review-implement -> converge before completing this feature."
    options: [approve, reject]
    on_reject: abort
