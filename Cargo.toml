[package]
name = "mostro-score"
version = "0.1.0"
edition = "2021"

[dependencies]
nostr-sdk = "0.43"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"
env_logger = "0.11"
log = "0.4"
mostro-core = "0.7.0"
thiserror = "2"
comfy-table = "7"
anstyle = "1"
anstream = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tokio = { version = "1", features = ["test-util"] }
insta = "1"
