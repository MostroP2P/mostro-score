[package]
name = "mostro-score"
version = "0.1.0"
edition = "2021"

[dependencies]
nostr-sdk = "0.38" # Or latest stable
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"
env_logger = "0.11"
log = "0.4"
dotenvy = "0.15"